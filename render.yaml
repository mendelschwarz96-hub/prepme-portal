# Render blueprint: one web service. The database is Neon (DATABASE_URL), not Render.
# Secrets marked "sync: false" are entered once in the Render dashboard and never committed.
services:
  - type: web
    name: prepme-portal
    runtime: python
    plan: starter
    region: ohio  # same region as the Neon database (AWS us-east-2)
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --workers 2 --timeout 60"
    healthCheckPath: /login/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: FIELD_ENCRYPTION_KEYS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: "portal.prepme.education,prepme-portal.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://portal.prepme.education,https://prepme-portal.onrender.com"
      - key: SITE_URL
        value: "https://portal.prepme.education"
      - key: TRUST_PROXY_HEADERS
        value: "1"
      - key: COLLEGE_SCORECARD_API_KEY
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "PrepMe Portal <portal@prepme.education>"
