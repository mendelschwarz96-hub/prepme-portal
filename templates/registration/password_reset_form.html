{% extends "base.html" %}
{% block content %}
<div class="card auth-box">
  <h1>Reset password</h1>
  <p class="subtle">Enter your email. If it belongs to an account, we'll send a reset link.</p>
  <form method="post" class="stacked">{% csrf_token %}{{ form.as_div }}
    <div class="form-actions"><button class="btn" type="submit">Send link</button></div>
  </form>
</div>
{% endblock %}
