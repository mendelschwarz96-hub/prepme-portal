{% extends "base.html" %}
{% block content %}
<div class="card auth-box">
  {% if validlink %}
  <h1>Choose a new password</h1>
  <form method="post" class="stacked">{% csrf_token %}{{ form.as_div }}
    <div class="form-actions"><button class="btn" type="submit">Save password</button></div>
  </form>
  {% else %}
  <h1>Link expired</h1>
  <p>This reset link is invalid or was already used. <a href="{% url 'password_reset' %}">Request a new one.</a></p>
  {% endif %}
</div>
{% endblock %}
