{% extends "base.html" %}
{% block title %}{{ title }} · PrepMe Portal{% endblock %}
{% block content %}
<div class="card">
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  <form method="post" class="form-actions">
    {% csrf_token %}
    <button type="submit" class="btn danger">{{ submit }}</button>
    <a class="btn secondary" href="{{ cancel_url }}">Cancel</a>
  </form>
</div>
{% endblock %}
