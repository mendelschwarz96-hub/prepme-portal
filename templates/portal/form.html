{% extends "base.html" %}
{% block title %}{{ title }} · PrepMe Portal{% endblock %}
{% block content %}
<div class="card">
  <h1>{{ title }}</h1>
  {% if intro %}<p class="subtle">{{ intro }}</p>{% endif %}
  <form method="post" class="stacked" novalidate>
    {% csrf_token %}
    {{ form.as_div }}
    <div class="form-actions">
      <button type="submit" class="btn">{{ submit }}</button>
      <a class="btn secondary" href="{{ cancel_url }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
